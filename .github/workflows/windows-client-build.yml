name: Windows client build

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/windows-client-build.yml"
      - ".github/workflows/windows-release.yml"
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/windows-client-build.yml"
      - ".github/workflows/windows-release.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Read client version
        id: client_version
        shell: pwsh
        run: |
          [xml] $project = Get-Content -Raw .\client\ProjectStatus.Client\ProjectStatus.Client.csproj
          $version = @($project.Project.PropertyGroup.Version) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read <Version> from ProjectStatus.Client.csproj."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Unexpected <Version> value in ProjectStatus.Client.csproj: '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Client version: $version"
      - name: Build
        run: dotnet build .\client\ProjectStatus.Client\ProjectStatus.Client.csproj -c Release
      - name: Publish self-contained win-x64
        run: dotnet publish .\client\ProjectStatus.Client\ProjectStatus.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts\win-x64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.client_version.outputs.version }}"
          $publishDir = (Resolve-Path ".\artifacts\win-x64").Path
          New-Item -ItemType Directory -Path ".\artifacts\installer" -Force | Out-Null
          $outputDir = (Resolve-Path ".\artifacts\installer").Path
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $iscc "/DMyAppVersion=$version" "/DPublishDir=$publishDir" "/O$outputDir" ".\client\installer\project_status.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "$outputDir\ProjectStatus-Setup-v$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not produced: expected $(Split-Path $installer -Leaf)."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectStatus-installer-ci
          path: artifacts/installer/ProjectStatus-Setup-v${{ steps.client_version.outputs.version }}.exe
          if-no-files-found: error
